services:
  - type: web
    name: bullseye-backend
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./bullseye.db
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
